[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoall"
version = "0.2.0"
description = "Auto-generate __all__ for any Python package on first import"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Isaac Onagh", email = "yesnacoc@gmail.com" }]
keywords = ["__all__", "packaging", "tooling", "introspection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage   = "https://github.com/i4147/autoall"
Repository = "https://github.com/i4147/autoall"
Issues     = "https://github.com/i4147/autoall/issues"

[project.scripts]
autoall = "autoall.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/autoall"]

[tool.hatch.build.targets.sdist]
include = ["src/autoall", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true