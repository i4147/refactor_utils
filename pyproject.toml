[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refactor-utils"
version = "4.0.0"
description = "Consolidate a Python package into one dependency-ordered file, or pack it into a self-extracting zip bundle."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Z User" }]
keywords = ["consolidate", "bundle", "merge", "python", "single-file", "zip", "modernize", "six", "pathlib"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "libcst>=1.1.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
format = ["black>=23.0", "ruff>=0.1.0"]
progress = ["tqdm>=4.0"]
dev = ["pytest>=7.0", "black", "ruff"]

[project.scripts]
pyrefactor = "refactor_utils.cli:main"

[project.urls]
Homepage = "https://example.invalid/refactor-utils"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refactor_utils = ["py.typed"]

[tool.pyrefactor]
# Self-consolidation config used by `pyrefactor .` on this very package.
# (Demonstrates the config-file feature; not required for installation.)
imports = "prune"
keep_docstrings = true
keep_comments = true

[tool.ruff]
line-length = 88
target-version = "py310"
