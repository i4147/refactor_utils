[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refactor_utils"
version = "1.4.8"
description = "Consolidate a small/medium Python module, library or project into a single, dependency-ordered file."
readme = "README.md"
requires-python = ">=3.10"
[project.scripts]
pyrefactor = "refactor_utils.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
