[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refactor_utils"
version = "2.0.0"
description = "Consolidate a small/medium Python module, library or project into a single, dependency-ordered file."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru",
    "tree-sitter",
    "tree_sitter_python",
]
[project.scripts]
pyrefactor = "refactor_utils.cli:main"

[project.optional-dependencies]
format = ["black"]
progress = ["tqdm"]
dev = ["pytest", "ruff"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9", "xhtml2pdf>=0.2.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refactor_utils = ["data/*", "data/**/*"]

[tool.pyrefactor]
# Example config — can be overridden per-project; this is for refactor_utils itself
exclude = ["tests/*", "test_*.py", "iwgfyrkugf.py"]
include = []
entry = []
imports = "prune"
format = false
copy_data = true

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
