[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refactor_utils"
version = "1.4.8"
description = "Consolidate a small/medium Python module, library or project into a single, dependency-ordered file."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru",
    "tree-sitter",
    "tree_sitter_python",
]
[project.optional-dependencies]
format = ["black", "ruff"]
progress = ["tqdm"]
test = ["pytest", "pytest-cov", "tqdm"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
pyrefactor = "refactor_utils.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refactor_utils = ["data/*", "data/**/*"]

[tool.pyrefactor]
# Example config — can be overridden per-project; this is for refactor_utils itself
exclude = ["tests/*", "test_*.py", "iwgfyrkugf.py"]
include = []
entry = []
rename_strategy = "prefix"
dedupe = "safe"
imports = "prune"
all = "ignore"
format = false
fail_on_warning = false
max_skipped = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring full consolidation",
]

[tool.coverage.run]
source = ["src/refactor_utils"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.mkdocstrings]
handlers.python.options.docstring_style = "google"
