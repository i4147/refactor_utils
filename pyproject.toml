[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refactor_utils"
version = "5.0.0"
description = "A minimal Python command-line application."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Isaac Onagh", email = "mkalafsaz@gmail.com" }]
dependencies = []

[project.scripts]
pyrefactor = "pyrefactor:main"

[tool.setuptools]
py-modules = ["pyrefactor"]
