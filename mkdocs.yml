site_name: refactor_utils
site_description: Consolidate Python packages into a single dependency-ordered file
site_url: https://github.com/i4147/refactor_utils
repo_url: https://github.com/i4147/refactor_utils
repo_name: i4147/refactor_utils

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - content.code.copy
    - content.action.view
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quickstart: quickstart.md
  - User Guide:
    - CLI Reference: cli-reference.md
    - Modes: modes.md
    - Configuration: configuration.md
    - Data Files: data-files.md
    - Examples: examples.md
  - Architecture:
    - Project Files: project-files.md
    - Overview: architecture.md
    - Edge Cases: edge-cases.md
  - API Reference:
    - refactor_utils: api/index.md
    - cli: api/cli.md
    - core: api/core.md
    - discovery: api/discovery.md
    - parser: api/parser.md
    - resolver: api/resolver.md
    - writer: api/writer.md
    - models: api/models.md
  - Development:
    - Contributing: contributing.md
    - Changelog: changelog.md
